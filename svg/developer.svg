<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="dg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18E7FF"/>
      <stop offset="100%" stop-color="#1677FF"/>
    </linearGradient>
    <linearGradient id="dg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C1A30"/>
      <stop offset="100%" stop-color="#061225"/>
    </linearGradient>
    <filter id="dg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <!-- DEVELOPER WORKSTATION EMBLEM — monitor + code + headphones -->

  <!-- Headphone arc (above monitor = developer identity) -->
  <path d="M26,22 Q26,6 48,6 Q70,6 70,22" fill="none" stroke="#6D4AFF" stroke-width="3" stroke-linecap="round" filter="url(#dg)"/>
  <!-- Headphone ear cups -->
  <rect x="20" y="18" width="10" height="14" rx="4" fill="#0C1A30" stroke="#6D4AFF" stroke-width="2" stroke-opacity="0.8"/>
  <rect x="66" y="18" width="10" height="14" rx="4" fill="#0C1A30" stroke="#6D4AFF" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Monitor frame -->
  <rect x="10" y="30" width="76" height="46" rx="4" fill="url(#dg2)" stroke="url(#dg1)" stroke-width="2" filter="url(#dg)"/>

  <!-- Screen area -->
  <rect x="15" y="35" width="66" height="36" rx="2" fill="#061225"/>

  <!-- Code lines on screen — bold, readable -->
  <line x1="20" y1="42" x2="40" y2="42" stroke="#18E7FF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="44" y1="42" x2="56" y2="42" stroke="#6D4AFF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>

  <line x1="24" y1="49" x2="50" y2="49" stroke="#1677FF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.65"/>
  <line x1="54" y1="49" x2="68" y2="49" stroke="#18E7FF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5"/>

  <line x1="20" y1="56" x2="34" y2="56" stroke="#FFB52E" stroke-width="2" stroke-linecap="round" stroke-opacity="0.55"/>
  <line x1="38" y1="56" x2="58" y2="56" stroke="#6D4AFF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.45"/>

  <line x1="24" y1="63" x2="46" y2="63" stroke="#1677FF" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.45"/>
  <line x1="50" y1="63" x2="72" y2="63" stroke="#18E7FF" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.35"/>

  <!-- Large </> symbol overlaid on screen (semi-transparent, bold) -->
  <text x="28" y="59" font-family="monospace" font-size="18" font-weight="bold" fill="#18E7FF" opacity="0.12">&lt;/&gt;</text>

  <!-- Monitor stand -->
  <rect x="38" y="76" width="20" height="5" rx="1.5" fill="#0A1628" stroke="#1677FF" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Stand base -->
  <rect x="28" y="81" width="40" height="4" rx="2" fill="#0C1A30" stroke="#1677FF" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Status dot on monitor (webcam) -->
  <circle cx="48" cy="33" r="1.8" fill="#18E7FF" opacity="0.6"/>

  <!-- Cursor blink on screen -->
  <rect x="60" y="54" width="2" height="6" rx="0.5" fill="#18E7FF" opacity="0.65"/>

  <!-- Small angular accents -->
  <path d="M6,40 L10,36" stroke="#18E7FF" stroke-width="1.2" stroke-opacity="0.3" stroke-linecap="round"/>
  <path d="M90,40 L86,36" stroke="#6D4AFF" stroke-width="1.2" stroke-opacity="0.25" stroke-linecap="round"/>
</svg>