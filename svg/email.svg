<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="mg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18E7FF"/>
      <stop offset="100%" stop-color="#1677FF"/>
    </linearGradient>
    <linearGradient id="mg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C1A30"/>
      <stop offset="100%" stop-color="#061225"/>
    </linearGradient>
    <filter id="mg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <!-- Futuristic Envelope Body -->
  <rect x="10" y="24" width="76" height="48" rx="6" fill="url(#mg2)" stroke="url(#mg1)" stroke-width="2.5" filter="url(#mg)"/>

  <!-- Envelope Flap lines -->
  <path d="M12,26 L48,52 L84,26" fill="none" stroke="#1677FF" stroke-width="2" stroke-linejoin="round" stroke-opacity="0.8"/>
  <path d="M12,70 L38,48" fill="none" stroke="#1677FF" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M84,70 L58,48" fill="none" stroke="#1677FF" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Central @ Symbol (Glowing Cyan) -->
  <g filter="url(#mg)">
    <circle cx="48" cy="46" r="14" fill="#061225" stroke="#18E7FF" stroke-width="1.8"/>
    <!-- @ inner shape -->
    <path d="M48,48 Q44,48 44,44 Q44,40 48,40 Q52,40 52,44 L52,47 Q52,50 49,50 Q46,50 46,47" fill="none" stroke="#18E7FF" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Signal/Transmission Arcs (top-right) -->
  <path d="M72,16 Q80,12 84,20" fill="none" stroke="#FFB52E" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M66,10 Q78,4 86,14" fill="none" stroke="#18E7FF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Tech Dots/Particles -->
  <circle cx="16" cy="32" r="2.2" fill="#18E7FF" opacity="0.6"/>
  <circle cx="80" cy="32" r="2.2" fill="#6D4AFF" opacity="0.6"/>
  <circle cx="20" cy="62" r="1.5" fill="#FFB52E" opacity="0.5"/>
  <circle cx="76" cy="62" r="1.5" fill="#18E7FF" opacity="0.5"/>
</svg>
