<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="pg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18E7FF"/>
      <stop offset="100%" stop-color="#1677FF"/>
    </linearGradient>
    <linearGradient id="pg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C1A30"/>
      <stop offset="100%" stop-color="#061225"/>
    </linearGradient>
    <filter id="pg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <!-- Cybernetic Telephone Handset -->
  <g filter="url(#pg)">
    <!-- Handset main curve -->
    <path d="M22,24 C22,20 30,14 38,20 L32,32 C28,30 26,28 26,26" fill="#0C1A30" stroke="url(#pg1)" stroke-width="2.5"/>
    <path d="M74,72 C74,76 66,82 58,76 L64,64 C68,66 70,68 70,70" fill="#0C1A30" stroke="url(#pg1)" stroke-width="2.5"/>
    
    <!-- Central connecting bar of the handset -->
    <path d="M28,26 Q12,50 34,70 Q42,78 58,76 Q54,66 64,64" fill="none" stroke="url(#pg1)" stroke-width="5" stroke-linecap="round"/>
    <!-- Highlight overlay on the bar -->
    <path d="M26,30 Q16,50 36,68" fill="none" stroke="#18E7FF" stroke-width="1.8" stroke-opacity="0.75" stroke-linecap="round"/>
  </g>

  <!-- Futuristic dial pad grid (inside curve area) -->
  <g opacity="0.4">
    <rect x="42" y="30" width="4" height="4" rx="1" fill="#18E7FF"/>
    <rect x="50" y="30" width="4" height="4" rx="1" fill="#18E7FF"/>
    <rect x="58" y="30" width="4" height="4" rx="1" fill="#18E7FF"/>
    <rect x="42" y="38" width="4" height="4" rx="1" fill="#1677FF"/>
    <rect x="50" y="38" width="4" height="4" rx="1" fill="#18E7FF"/>
    <rect x="58" y="38" width="4" height="4" rx="1" fill="#1677FF"/>
    <rect x="42" y="46" width="4" height="4" rx="1" fill="#1677FF"/>
    <rect x="50" y="46" width="4" height="4" rx="1" fill="#1677FF"/>
    <rect x="58" y="46" width="4" height="4" rx="1" fill="#1677FF"/>
  </g>

  <!-- Communication waves (outgoing call indicator, top-right) -->
  <path d="M56,16 Q68,8 76,20" fill="none" stroke="#18E7FF" stroke-width="2.5" stroke-linecap="round" filter="url(#pg)"/>
  <path d="M64,8 Q80,-2 88,14" fill="none" stroke="#6D4AFF" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
  <path d="M72,0 Q92,-12 100,8" fill="none" stroke="#FFB52E" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Particles / Tech Accents -->
  <circle cx="22" cy="18" r="2" fill="#FFB52E" opacity="0.6"/>
  <circle cx="74" cy="78" r="2" fill="#18E7FF" opacity="0.6"/>
  <circle cx="48" cy="62" r="1.5" fill="#1677FF" opacity="0.4"/>
</svg>
