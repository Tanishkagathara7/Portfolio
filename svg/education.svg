<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="eg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18E7FF"/>
      <stop offset="100%" stop-color="#1677FF"/>
    </linearGradient>
    <linearGradient id="eg2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#6D4AFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1677FF"/>
    </linearGradient>
    <filter id="eg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <!-- GRADUATION CAP — bold, fills the space -->

  <!-- Cap board (large diamond) -->
  <polygon points="48,16 8,38 48,58 88,38" fill="url(#eg1)" opacity="0.9" filter="url(#eg)"/>
  <!-- Cap board inner highlight -->
  <polygon points="48,22 18,38 48,52 78,38" fill="#18E7FF" opacity="0.12"/>

  <!-- Circuit traces on cap surface -->
  <line x1="30" y1="35" x2="48" y2="35" stroke="#061225" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="48" y1="35" x2="48" y2="28" stroke="#061225" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="48" cy="28" r="2" fill="#FFB52E" opacity="0.8"/>
  <line x1="55" y1="40" x2="68" y2="33" stroke="#061225" stroke-width="1.2" stroke-opacity="0.4"/>
  <circle cx="30" cy="35" r="1.5" fill="#061225" opacity="0.6"/>
  <circle cx="68" cy="33" r="1.5" fill="#061225" opacity="0.5"/>

  <!-- Cap base / band -->
  <path d="M24,42 L24,56 Q48,70 72,56 L72,42 Q48,56 24,42Z" fill="#0A1628" stroke="#1677FF" stroke-width="1.8" stroke-opacity="0.7"/>
  <!-- Band inner glow line -->
  <path d="M30,46 Q48,58 66,46" fill="none" stroke="#18E7FF" stroke-width="1" stroke-opacity="0.3"/>

  <!-- </> code symbol on band center -->
  <text x="36" y="55" font-family="monospace" font-size="11" font-weight="bold" fill="#18E7FF" opacity="0.75">&lt;/&gt;</text>

  <!-- Tassel -->
  <line x1="72" y1="36" x2="82" y2="58" stroke="#FFB52E" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="82" cy="60" r="3.5" fill="#FFB52E" opacity="0.85"/>

  <!-- Button on top of cap -->
  <circle cx="48" cy="20" r="3.5" fill="#0A1628" stroke="#18E7FF" stroke-width="1.5"/>

  <!-- Book base under cap -->
  <rect x="20" y="68" width="56" height="10" rx="2.5" fill="#0C1A30" stroke="#1677FF" stroke-width="1.5" stroke-opacity="0.55"/>
  <!-- Book pages line -->
  <line x1="24" y1="73" x2="72" y2="73" stroke="#18E7FF" stroke-width="0.8" stroke-opacity="0.25"/>
  <!-- Second book (offset) -->
  <rect x="24" y="78" width="48" height="8" rx="2" fill="#0A1628" stroke="#6D4AFF" stroke-width="1.2" stroke-opacity="0.45"/>
  <line x1="28" y1="82" x2="50" y2="82" stroke="#6D4AFF" stroke-width="0.7" stroke-opacity="0.3"/>

  <!-- Small geometric accent (angular, not circular) -->
  <path d="M10,28 L14,24 L18,28" stroke="#18E7FF" stroke-width="1.2" stroke-opacity="0.35" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M78,70 L82,74 L78,78" stroke="#6D4AFF" stroke-width="1" stroke-opacity="0.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>