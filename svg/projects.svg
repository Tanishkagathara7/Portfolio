<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="pg1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1677FF"/>
      <stop offset="100%" stop-color="#18E7FF"/>
    </linearGradient>
    <linearGradient id="pg2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1677FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#18E7FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFB52E" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="pg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C1A30"/>
      <stop offset="100%" stop-color="#061225"/>
    </linearGradient>
    <filter id="pg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="pt" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
  </defs>

  <!-- ROCKET LAUNCH FROM CODE WINDOW — bold, fills the space -->

  <!-- Browser/code window at bottom -->
  <rect x="14" y="56" width="68" height="34" rx="4" fill="url(#pg3)" stroke="#1677FF" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Title bar -->
  <rect x="14" y="56" width="68" height="10" rx="4" fill="#0A1628"/>
  <rect x="14" y="62" width="68" height="4" fill="#0A1628"/>
  <!-- Traffic lights -->
  <circle cx="22" cy="61" r="2.2" fill="#FF5F57" opacity="0.7"/>
  <circle cx="29" cy="61" r="2.2" fill="#FFBD2E" opacity="0.7"/>
  <circle cx="36" cy="61" r="2.2" fill="#28C840" opacity="0.7"/>

  <!-- Code lines inside window -->
  <line x1="20" y1="72" x2="38" y2="72" stroke="#18E7FF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.55"/>
  <line x1="42" y1="72" x2="54" y2="72" stroke="#6D4AFF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.4"/>
  <line x1="24" y1="78" x2="48" y2="78" stroke="#1677FF" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.4"/>
  <line x1="52" y1="78" x2="66" y2="78" stroke="#18E7FF" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.3"/>
  <line x1="20" y1="84" x2="36" y2="84" stroke="#FFB52E" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.35"/>
  <line x1="40" y1="84" x2="56" y2="84" stroke="#6D4AFF" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.25"/>

  <!-- Launch trail / exhaust (behind rocket) -->
  <path d="M48,56 L48,70" stroke="url(#pg2)" stroke-width="8" stroke-linecap="round" filter="url(#pt)" opacity="0.7"/>
  <!-- Secondary trail glow -->
  <path d="M48,50 L48,62" stroke="#18E7FF" stroke-width="4" stroke-linecap="round" filter="url(#pt)" opacity="0.3"/>

  <!-- ROCKET — large, bold, occupies top 60% -->
  <g filter="url(#pg)">
    <!-- Rocket body -->
    <path d="M48,4 Q36,18 36,40 L40,48 L56,48 L60,40 Q60,18 48,4Z" fill="#0A1628" stroke="url(#pg1)" stroke-width="2.5"/>

    <!-- Rocket window -->
    <circle cx="48" cy="24" r="6" fill="#061225" stroke="#18E7FF" stroke-width="2"/>
    <circle cx="48" cy="24" r="3.5" fill="#18E7FF" opacity="0.15"/>
    <!-- Window glint -->
    <circle cx="46" cy="22" r="1.2" fill="#18E7FF" opacity="0.4"/>

    <!-- Rocket body stripe -->
    <line x1="40" y1="36" x2="56" y2="36" stroke="#1677FF" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Left fin -->
    <path d="M36,36 L26,50 L36,46Z" fill="#0C1A30" stroke="#6D4AFF" stroke-width="1.8" stroke-opacity="0.7"/>
    <!-- Right fin -->
    <path d="M60,36 L70,50 L60,46Z" fill="#0C1A30" stroke="#6D4AFF" stroke-width="1.8" stroke-opacity="0.7"/>

    <!-- Nose cone highlight -->
    <path d="M48,6 Q44,14 42,24" stroke="#18E7FF" stroke-width="1" stroke-opacity="0.3" fill="none"/>
  </g>

  <!-- Flame -->
  <path d="M40,48 Q44,58 48,62 Q52,58 56,48" fill="#FFB52E" opacity="0.8"/>
  <path d="M43,48 Q46,54 48,56 Q50,54 53,48" fill="#18E7FF" opacity="0.45"/>

  <!-- Exhaust sparks -->
  <circle cx="44" cy="58" r="1.5" fill="#FFB52E" opacity="0.6"/>
  <circle cx="52" cy="60" r="1.2" fill="#18E7FF" opacity="0.45"/>
  <circle cx="46" cy="63" r="1" fill="#FFB52E" opacity="0.4"/>

  <!-- Speed lines -->
  <line x1="38" y1="10" x2="36" y2="4" stroke="#18E7FF" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.35"/>
  <line x1="58" y1="10" x2="60" y2="4" stroke="#18E7FF" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.3"/>
  <line x1="32" y1="16" x2="28" y2="12" stroke="#1677FF" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.25"/>
  <line x1="64" y1="16" x2="68" y2="12" stroke="#1677FF" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.2"/>
</svg>