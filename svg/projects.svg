<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <filter id="proj-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="proj-soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5"/>
    </filter>
    <filter id="proj-trail-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5"/>
    </filter>
    <linearGradient id="proj-cyan-grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1677FF"/>
      <stop offset="100%" stop-color="#18E7FF"/>
    </linearGradient>
    <linearGradient id="proj-trail-grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1677FF" stop-opacity="0"/>
      <stop offset="40%" stop-color="#18E7FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFB52E" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="proj-screen-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C1A30"/>
      <stop offset="100%" stop-color="#061225"/>
    </linearGradient>
  </defs>

  <!-- Ambient glow -->
  <ellipse class="icon-glow" cx="80" cy="82" rx="38" ry="34" fill="#18E7FF" opacity="0.05" filter="url(#proj-soft-glow)"/>

  <!-- HUD orbital arcs -->
  <path class="icon-orbit" d="M25 115 Q12 78 32 42" stroke="#1677FF" stroke-width="0.8" stroke-opacity="0.3" fill="none" stroke-linecap="round"/>
  <path class="icon-orbit" d="M135 42 Q152 78 132 115" stroke="#6D4AFF" stroke-width="0.8" stroke-opacity="0.22" fill="none" stroke-linecap="round"/>

  <!-- Orbital path (dotted ellipse around rocket) -->
  <ellipse class="icon-orbit" cx="80" cy="70" rx="50" ry="18" fill="none" stroke="#1677FF" stroke-width="0.5" stroke-opacity="0.15" stroke-dasharray="3 4" transform="rotate(-15, 80, 70)"/>

  <!-- Tiny particle dots -->
  <circle class="icon-particle" cx="40" cy="35" r="1.2" fill="#18E7FF" opacity="0.45"/>
  <circle class="icon-particle" cx="130" cy="40" r="1" fill="#6D4AFF" opacity="0.35"/>
  <circle class="icon-particle" cx="28" cy="95" r="0.8" fill="#FFB52E" opacity="0.4"/>
  <circle class="icon-particle" cx="140" cy="100" r="1" fill="#18E7FF" opacity="0.3"/>
  <circle class="icon-particle" cx="95" cy="30" r="0.9" fill="#1677FF" opacity="0.35"/>

  <!-- HUD brackets -->
  <path d="M28 65 L24 69 L28 73" stroke="#18E7FF" stroke-width="0.7" stroke-opacity="0.35" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M132 65 L136 69 L132 73" stroke="#6D4AFF" stroke-width="0.7" stroke-opacity="0.28" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- === MAIN COMPOSITION === -->

  <!-- Browser/code window (base) -->
  <g class="icon-screen" transform="translate(80, 100)">
    <!-- Window frame -->
    <rect x="-34" y="-16" width="68" height="40" rx="3.5" fill="url(#proj-screen-grad)" stroke="#1677FF" stroke-width="1" stroke-opacity="0.5"/>
    <!-- Title bar -->
    <rect x="-34" y="-16" width="68" height="8" rx="3.5" fill="#0A1628"/>
    <rect x="-34" y="-12" width="68" height="4" fill="#0A1628"/>
    <!-- Traffic lights -->
    <circle cx="-27" cy="-12" r="1.5" fill="#FF5F57" opacity="0.6"/>
    <circle cx="-21" cy="-12" r="1.5" fill="#FFBD2E" opacity="0.6"/>
    <circle cx="-15" cy="-12" r="1.5" fill="#28C840" opacity="0.6"/>
    <!-- URL bar -->
    <rect x="-8" y="-14" width="36" height="4" rx="2" fill="#061225" opacity="0.8"/>

    <!-- Screen content area -->
    <rect x="-30" y="-6" width="60" height="26" fill="#061225"/>

    <!-- Code lines -->
    <line x1="-24" y1="0" x2="-10" y2="0" stroke="#18E7FF" stroke-width="1" stroke-opacity="0.55" stroke-linecap="round"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#6D4AFF" stroke-width="1" stroke-opacity="0.4" stroke-linecap="round"/>
    <line x1="-20" y1="5" x2="2" y2="5" stroke="#1677FF" stroke-width="0.9" stroke-opacity="0.45" stroke-linecap="round"/>
    <line x1="6" y1="5" x2="18" y2="5" stroke="#FFB52E" stroke-width="0.9" stroke-opacity="0.35" stroke-linecap="round"/>
    <line x1="-24" y1="10" x2="-8" y2="10" stroke="#18E7FF" stroke-width="0.9" stroke-opacity="0.35" stroke-linecap="round"/>
    <line x1="-4" y1="10" x2="14" y2="10" stroke="#6D4AFF" stroke-width="0.8" stroke-opacity="0.3" stroke-linecap="round"/>
    <line x1="-20" y1="15" x2="-6" y2="15" stroke="#1677FF" stroke-width="0.8" stroke-opacity="0.3" stroke-linecap="round"/>
  </g>

  <!-- Rocket launching from the window -->
  <g class="icon-core" transform="translate(80, 52)">
    <!-- Launch trail/exhaust -->
    <path d="M0,22 L0,38" stroke="url(#proj-trail-grad)" stroke-width="4" stroke-linecap="round" filter="url(#proj-trail-glow)"/>
    <!-- Trail particles -->
    <circle cx="-3" cy="32" r="1.2" fill="#FFB52E" opacity="0.5"/>
    <circle cx="4" cy="35" r="1" fill="#18E7FF" opacity="0.4"/>
    <circle cx="-2" cy="38" r="0.8" fill="#FFB52E" opacity="0.35"/>

    <!-- Rocket body -->
    <path d="M0,-18 Q-8,-8 -8,10 L-4,16 L4,16 L8,10 Q8,-8 0,-18Z" fill="#0A1628" stroke="url(#proj-cyan-grad)" stroke-width="1.2" filter="url(#proj-glow)"/>
    <!-- Rocket window -->
    <circle cx="0" cy="-2" r="4" fill="#061225" stroke="#18E7FF" stroke-width="0.8"/>
    <circle cx="0" cy="-2" r="2.5" fill="#18E7FF" opacity="0.15"/>
    <!-- Rocket fins -->
    <path d="M-8,8 L-13,16 L-8,14Z" fill="#0C1A30" stroke="#6D4AFF" stroke-width="0.7" stroke-opacity="0.6"/>
    <path d="M8,8 L13,16 L8,14Z" fill="#0C1A30" stroke="#6D4AFF" stroke-width="0.7" stroke-opacity="0.6"/>
    <!-- Nose cone highlight -->
    <path d="M0,-18 Q-3,-12 -3,-6" stroke="#18E7FF" stroke-width="0.5" stroke-opacity="0.3" fill="none"/>
    <!-- Flame -->
    <path d="M-4,16 Q-2,22 0,24 Q2,22 4,16" fill="#FFB52E" opacity="0.7"/>
    <path d="M-2,16 Q0,20 2,16" fill="#18E7FF" opacity="0.4"/>
  </g>

  <!-- Floating project UI cards orbiting -->
  <g class="icon-code" transform="translate(42, 58)" opacity="0.4">
    <rect x="0" y="0" width="16" height="11" rx="2" fill="#061225" stroke="#18E7FF" stroke-width="0.6"/>
    <line x1="3" y1="3" x2="10" y2="3" stroke="#18E7FF" stroke-width="0.6" stroke-opacity="0.5" stroke-linecap="round"/>
    <line x1="3" y1="6" x2="7" y2="6" stroke="#6D4AFF" stroke-width="0.5" stroke-opacity="0.4" stroke-linecap="round"/>
  </g>

  <g class="icon-code" transform="translate(108, 52)" opacity="0.35">
    <rect x="0" y="0" width="14" height="10" rx="2" fill="#061225" stroke="#6D4AFF" stroke-width="0.6"/>
    <rect x="3" y="3" width="4" height="4" rx="0.5" fill="#1677FF" opacity="0.3"/>
    <line x1="9" y1="4" x2="12" y2="4" stroke="#18E7FF" stroke-width="0.5" stroke-opacity="0.4" stroke-linecap="round"/>
  </g>

  <!-- Mobile device fragment -->
  <g transform="translate(118, 78)" opacity="0.3">
    <rect x="0" y="0" width="10" height="16" rx="2" fill="#061225" stroke="#1677FF" stroke-width="0.6"/>
    <line x1="2" y1="4" x2="8" y2="4" stroke="#18E7FF" stroke-width="0.5" stroke-opacity="0.4" stroke-linecap="round"/>
    <line x1="2" y1="7" x2="6" y2="7" stroke="#6D4AFF" stroke-width="0.4" stroke-opacity="0.35" stroke-linecap="round"/>
    <circle cx="5" cy="12" r="1" fill="none" stroke="#1677FF" stroke-width="0.5" stroke-opacity="0.4"/>
  </g>

  <!-- Speed lines / launch streaks -->
  <line x1="70" y1="28" x2="72" y2="22" stroke="#18E7FF" stroke-width="0.6" stroke-opacity="0.3" stroke-linecap="round"/>
  <line x1="90" y1="26" x2="88" y2="20" stroke="#18E7FF" stroke-width="0.6" stroke-opacity="0.25" stroke-linecap="round"/>
  <line x1="76" y1="30" x2="77" y2="24" stroke="#1677FF" stroke-width="0.5" stroke-opacity="0.2" stroke-linecap="round"/>

  <!-- Small hexagon -->
  <polygon points="38,42 42,39 46,42 46,47 42,50 38,47" fill="none" stroke="#18E7FF" stroke-width="0.6" stroke-opacity="0.25"/>

  <!-- Tiny tech lines -->
  <line x1="42" y1="140" x2="60" y2="140" stroke="#1677FF" stroke-width="0.5" stroke-opacity="0.18"/>
  <line x1="100" y1="142" x2="118" y2="142" stroke="#6D4AFF" stroke-width="0.5" stroke-opacity="0.14"/>

  <!-- Code tag -->
  <g transform="translate(30, 80)" opacity="0.3">
    <text font-family="monospace" font-size="7" fill="#18E7FF">&lt;/&gt;</text>
  </g>
</svg>